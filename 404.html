<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Swift Movers</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root{--navy:#071426;--navy2:#0d2038;--gold:#d6a63a;--muted:#bfc9d8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(214,166,58,.12),transparent 26%),radial-gradient(circle at 85% 85%,rgba(7,20,38,.09),transparent 28%),#f5f7fb;color:var(--navy);font-family:inherit}
    .error-page{min-height:100vh;display:flex;flex-direction:column}
    .error-header{padding:20px 24px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid #e8edf4}
    .error-header-inner{width:min(1180px,100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .error-logo{font-size:25px;font-weight:900;text-decoration:none;color:var(--navy);letter-spacing:-.04em}
    .error-logo span{color:var(--gold)}
    .top-link{padding:10px 15px;border:1px solid #dce3ec;background:#fff;border-radius:12px;text-decoration:none;color:var(--navy);font-weight:800;transition:.2s ease}
    .top-link:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(7,20,38,.08);border-color:rgba(214,166,58,.7)}
    .error-main{flex:1;display:grid;place-items:center;padding:60px 24px}
    .error-card{width:min(900px,100%);overflow:hidden;position:relative;text-align:center;padding:clamp(44px,7vw,78px);border-radius:30px;color:#fff;background:linear-gradient(145deg,rgba(7,20,38,.99),rgba(13,32,56,.97));box-shadow:0 28px 70px rgba(7,20,38,.16)}
    .error-card:before,.error-card:after{content:"";position:absolute;border:1px solid rgba(214,166,58,.18);border-radius:50%;pointer-events:none}
    .error-card:before{width:330px;height:330px;right:-155px;top:-175px}.error-card:after{width:220px;height:220px;left:-135px;bottom:-125px}
    .error-number{position:relative;margin:0;color:var(--gold);font-size:clamp(92px,18vw,172px);font-weight:1000;line-height:.8;letter-spacing:-.09em}
    .error-kicker{position:relative;margin:28px 0 10px;color:#e7c66f;font-size:12px;font-weight:900;letter-spacing:.18em}
    h1{position:relative;margin:0;font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-.03em}
    .error-copy{position:relative;max-width:620px;margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.7}
    .error-actions{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .error-btn{min-width:160px;padding:13px 18px;border-radius:13px;text-decoration:none;font-weight:900;transition:.2s ease}
    .error-btn:hover{transform:translateY(-2px)}
    .primary{color:var(--navy);background:linear-gradient(135deg,#d6a63a,#f1cf72);box-shadow:0 12px 28px rgba(214,166,58,.22)}
    .secondary{color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13)}
    footer{text-align:center;padding:20px 24px 28px;color:#8a96a8;font-size:12px}
    @media(max-width:620px){.error-header{padding:16px}.error-logo{font-size:21px}.top-link{font-size:13px;padding:9px 12px}.error-main{padding:34px 16px}.error-card{border-radius:22px;padding:42px 22px}.error-copy{font-size:15px}.error-btn{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="error-page">
  <header class="error-header">
    <div class="error-header-inner">
      <a href="/" class="error-logo">Swift<span>Movers</span></a>
      <a href="/" class="top-link">Back to Home</a>
    </div>
  </header>
  <main class="error-main">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-number" aria-hidden="true">404</p>
      <p class="error-kicker">WRONG TURN</p>
      <h1 id="error-title">This page has moved.</h1>
      <p class="error-copy">The page you are looking for could not be found. Let’s get you back on the right route.</p>
      <div class="error-actions">
        <a href="/" class="error-btn primary">Return Home</a>
        <a href="/pages/quotation.html" class="error-btn secondary">Request a Quote</a>
      </div>
    </section>
  </main>
  <footer>© 2026 Swift Movers. All rights reserved.</footer>
</div>
<script src="/js/whatsapp-float.js"></script>
</body>
</html>
